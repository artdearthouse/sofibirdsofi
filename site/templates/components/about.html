<div class="r t-rec t-rec_pt_75 t-rec_pb_75" data-record-type="222" id="rec{{ section.id }}" style="padding-top:75px;padding-bottom:75px; ">
<!-- T194 -->
<div class="t194">
<div class="t-container">
<div class="t-col t-col_8 t-prefix_2">
<div class="t194__text t-text t-text_md" field="text">{{ common.about.text_html|rich }}</div>
</div>
<div class="t-col t-col_2 t-align_left" itemscope="" itemtype="http://schema.org/ImageObject">
<meta content="{{ common.about.image.src|asset }}" itemprop="image"/>

<div class="t194__sectitle" field="imgtitle" itemprop="name">{{ common.about.title }}</div>
<div class="t194__secdescr" field="imgdescr" itemprop="description">{{ common.about.description }}</div>
</div>
</div>
</div>
